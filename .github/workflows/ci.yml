name: CI

on:
  push:
    branches: [main, test/imagegen-lock-run-ad2410]
  pull_request:

jobs:
  test:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/test/imagegen-lock-run-ad2410') }}
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A hang must fail LOUDLY and fast, not sit burning runner time until the
    # 6h default -- a job stuck at "in_progress" reads as "not done yet"
    # rather than "broken", which is how a false green gets merged.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.11" -- cover the floor and a current minor.
        python-version: ["3.11", "3.12"]
    env:
      # Placeholder, non-functional key. mount() only checks for presence
      # (not validity) before constructing the provider -- without *some*
      # key, mount() returns None and every behavioral/structural test
      # that depends on a mounted provider fails/errors. Tests that need
      # a real, working key are marked `live` and deselected below.
      OPENAI_API_KEY: sk-test-placeholder-not-a-real-key-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run test suite
        # Deselects tests marked `live`: two tests need a genuine OpenAI
        # API key and real network access (list_models() against the
        # real /models endpoint, and a real vision completion). Run
        # those locally with a real OPENAI_API_KEY to validate.
        run: uv run pytest -q -m "not live"

      - name: Verify wheel runtime dependencies without the dev group
        # Also exercise the supported SDK floor rather than only a fresh
        # resolver's newest SDK. Older retained SDKs used to disable compact.
        run: |
          uv build --wheel
          uv venv "$RUNNER_TEMP/provider-runtime"
          uv pip install --python "$RUNNER_TEMP/provider-runtime/bin/python" dist/*.whl amplifier-core 'openai==3.29.0'
          "$RUNNER_TEMP/provider-runtime/bin/python" -I tests/runtime_install_smoke.py

      - name: Verify minimum SDK compaction with Core 2.0.1
        run: |
          uv pip install 'openai==3.29.0' 'amplifier-core==2.0.1'
          uv run --no-sync pytest -q tests/test_wait_policy.py tests/test_native_compaction.py tests/test_image_operation.py

  imagegen-manifest-lock:
    # A preparation-branch push never selects this job. Execution needs a
    # separately admitted exact commit pushed to this one test-only run branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/test/imagegen-lock-run-ad2410'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: imagegen-manifest-lock
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Initialize a non-success preparation receipt
        run: |
          set -eu
          out="$RUNNER_TEMP/imagegen-manifest-lock-evidence"
          test ! -e "$out"
          mkdir -m 700 "$out"
          printf '{"status":"BLOCKED","phase":"toolchain_preparation","source":"%s","runId":"%s","attempt":"%s","startedAt":%s,"lockPublished":false}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$(date +%s)" > "$out/lock-result.json"
      - name: Install pinned resolver toolchain
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        timeout-minutes: 2
        with:
          version: '0.9.18'
          python-version: '3.13'
          enable-cache: false
      - name: Select Python 3.13 explicitly
        timeout-minutes: 1
        run: uv python install --no-config 3.13
      - name: Resolve and validate only the frozen manifests
        timeout-minutes: 6
        run: |
          set -eu
          python="$(uv python find --no-config --no-python-downloads 3.13)"
          "$python" -I tests/imagegen_manifest_lock.py
      - name: Retain validated lock or explicit failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imagegen-manifest-lock-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/imagegen-manifest-lock-evidence/uv.lock
            ${{ runner.temp }}/imagegen-manifest-lock-evidence/lock-result.json
            ${{ runner.temp }}/imagegen-manifest-lock-evidence/lock.log
          if-no-files-found: error
